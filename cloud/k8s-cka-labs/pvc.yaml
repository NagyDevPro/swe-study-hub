apiVersion: v1
kind: Pod
metadata:
  name: webapp
  namespace: default
spec:
  containers:
  - env:
    - name: LOG_HANDLERS
      value: file
    name: webapp  
    image: kodekloud/event-simulator
    volumeMounts:
    - mountPath: /log
      name: kube-api-access-slfkl
  volumes:
  - name: kube-api-access-slfkl
    hostPath:
      path: /var/log/webapp
      type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claim-log-1
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Mi